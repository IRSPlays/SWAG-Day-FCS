<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Cover artwork · "Pulang" · duotone violet/cyan · road-home motif -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0a1c"/>
      <stop offset="0.62" stop-color="#141033"/>
      <stop offset="0.63" stop-color="#08060f"/>
      <stop offset="1" stop-color="#08060f"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.72" cy="0.26" r="0.5">
      <stop offset="0" stop-color="#23dcff" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#23dcff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#23dcff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f6bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8f6bff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="480" fill="url(#sky)"/>
  <rect width="480" height="480" fill="url(#moonGlow)"/>
  <circle cx="346" cy="125" r="42" fill="#23dcff" opacity="0.9"/>
  <circle cx="346" cy="125" r="42" fill="none" stroke="#f4f7ff" stroke-opacity="0.25" stroke-width="1"/>
  <!-- stars -->
  <g fill="#f4f7ff">
    <circle cx="60" cy="52" r="1.6" opacity="0.7"/><circle cx="140" cy="96" r="1.2" opacity="0.5"/>
    <circle cx="230" cy="48" r="1.4" opacity="0.6"/><circle cx="410" cy="70" r="1.3" opacity="0.5"/>
    <circle cx="90" cy="160" r="1.1" opacity="0.4"/><circle cx="270" cy="130" r="1.1" opacity="0.45"/>
    <circle cx="430" cy="180" r="1.4" opacity="0.5"/><circle cx="34" cy="110" r="1.1" opacity="0.4"/>
  </g>
  <!-- light shaft -->
  <polygon points="0,0 190,0 0,300" fill="url(#beam)"/>
  <!-- horizon -->
  <rect x="0" y="300" width="480" height="2" fill="#23dcff" opacity="0.55"/>
  <rect x="0" y="306" width="480" height="1" fill="#f4f7ff" opacity="0.12"/>
  <!-- distant home light on the horizon -->
  <rect x="216" y="288" width="10" height="10" fill="#23dcff" opacity="0.85"/>
  <rect x="214" y="286" width="14" height="14" fill="none" stroke="#23dcff" stroke-opacity="0.35"/>
  <!-- road converging home -->
  <polygon points="218,302 262,302 430,480 50,480" fill="#100d24"/>
  <polygon points="218,302 262,302 430,480 50,480" fill="none" stroke="#f4f7ff" stroke-opacity="0.14" stroke-width="1.5"/>
  <!-- centre dashes -->
  <g fill="#f4f7ff">
    <rect x="238" y="322" width="4" height="16" opacity="0.5"/>
    <rect x="235.5" y="362" width="9" height="26" opacity="0.4"/>
    <rect x="231" y="420" width="18" height="38" opacity="0.3"/>
  </g>
  <!-- grain -->
  <g fill="#f4f7ff">
    <circle cx="410" cy="380" r="1" opacity="0.15"/><circle cx="60" cy="420" r="1" opacity="0.12"/>
    <circle cx="330" cy="440" r="1" opacity="0.1"/><circle cx="150" cy="350" r="1" opacity="0.1"/>
    <circle cx="440" cy="300" r="1" opacity="0.12"/><circle cx="30" cy="330" r="1" opacity="0.1"/>
  </g>
</svg>
